<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sphere" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#2c2158"/>
      <stop offset="45%" stop-color="#171035"/>
      <stop offset="100%" stop-color="#0a0714"/>
    </radialGradient>
    <linearGradient id="crack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="55%" stop-color="#a78bff"/>
      <stop offset="100%" stop-color="#4dd8ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f8cff"/>
      <stop offset="100%" stop-color="#0b1e4a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="mist" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="sphereClip">
      <circle cx="32" cy="32" r="22"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="#05060a"/>

  <circle cx="32" cy="32" r="22" fill="url(#sphere)" stroke="#241b4d" stroke-width="1.2"/>

  <g clip-path="url(#sphereClip)">
    <path d="M10 50 C18 45 24 46 30 50 C36 54 42 46 54 50 L54 60 L10 60 Z" fill="url(#sea)"/>
  </g>

  <path d="M25 20 L27.5 24.5 L24.5 28 L29.5 32.5 L26 37 L31 41.5 L28.5 46"
        fill="none" stroke="url(#crack)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <g filter="url(#mist)" fill="#c7d2ff">
    <circle cx="22" cy="16" r="4" opacity=".55"/>
    <circle cx="26" cy="14" r="3.4" opacity=".45"/>
    <circle cx="18" cy="17" r="2.6" opacity=".35"/>
    <circle cx="28.5" cy="16.5" r="2.2" opacity=".4"/>
    <circle cx="20.5" cy="18.5" r="2.4" opacity=".3"/>
  </g>

  <g fill="none" stroke-linecap="round" opacity=".7">
    <path d="M44 18 L44 22 M42 20 L46 20" stroke="#a78bff" stroke-width="1.2"/>
    <path d="M49 27 L49 31 M47 29 L51 29" stroke="#4dd8ff" stroke-width="1"/>
    <path d="M41 44 L41 47 M39.5 45.5 L42.5 45.5" stroke="#7c5cff" stroke-width="1"/>
  </g>
</svg>
